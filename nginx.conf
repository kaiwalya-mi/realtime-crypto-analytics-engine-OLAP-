# ============================================================
# File 6: nginx.conf
# Description: NGINX reverse proxy configuration with a 2-second 
#              query cache TTL and request rate limiting.
# ============================================================

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=clickhouse_cache:10m max_size=1g inactive=10m use_temp_path=off;

    limit_req_zone $binary_remote_addr zone=req_limit:10m rate=10r/s;

    upstream clickhouse_backend {
        server clickhouse:8123;
    }

    server {
        listen 80;

        location / {
            limit_req zone=req_limit burst=20 nodelay;

            proxy_pass http://clickhouse_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;

            proxy_cache clickhouse_cache;
            proxy_cache_valid 200 2s;
            proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
            proxy_cache_bypass $http_pragma;
            
            add_header X-Proxy-Cache $upstream_cache_status;
        }
    }
}
